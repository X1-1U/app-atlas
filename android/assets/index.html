<dialog id="detail" tabindex="-1"><div class="dialog-handle" aria-hidden="true"></div><h2 id="detail-title"></h2><div id="detail-body"></div><div class="actions"><button class="btn primary" id="open-file">開啟檔案</button><button class="btn danger" id="delete-file">刪除…</button><button class="btn" onclick="document.getElementById('detail').close()">關閉</button></div></dialog>
<dialog id="folder-dialog"><div class="dialog-handle" aria-hidden="true"></div><h2>把資料夾歸到 App</h2><p>輸入分類名稱，再選擇手機上的資料夾。你可以替同一個 App 加入多個資料夾。</p><label for="app-name">App 或分類名稱</label><input id="app-name" maxlength="40" placeholder="例如 Telegram" list="app-names"><datalist id="app-names"><option value="Telegram"><option value="Bilibili"><option value="WhatsApp"></datalist><p>Android/data 等受限制的目錄可能無法選取。第一版只接受手機本機儲存空間。</p><div class="actions"><button class="btn primary" id="choose-folder">選擇資料夾</button><button class="btn" onclick="document.getElementById('folder-dialog').close()">取消</button></div></dialog><div id="toast" role="status" hidden></div>
<script src="cleanup.js"></script><script src="file-intelligence.js"></script><script src="app.js"></script></body></html>
