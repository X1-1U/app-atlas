<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾檔 · 手機預覽</title><style>
*{box-sizing:border-box}body{margin:0;background:#101512;color:#e4eee8;font:14px/1.5 system-ui,sans-serif}.controls{padding:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #33443b}.controls strong{margin-right:auto}select,button{background:#23352c;border:1px solid #466052;color:inherit;border-radius:8px;padding:8px;font:inherit}.stage{display:flex;justify-content:flex-end;padding:20px;overflow:auto}.phone{flex:none;width:414px;border:7px solid #303b35;border-radius:36px;background:#101915;box-shadow:0 12px 45px #0008;overflow:hidden}.status{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px}.camera{width:8px;height:8px;background:#020403;border-radius:50%}iframe{display:block;border:0;width:100%;height:760px;background:#101915}.gesture{height:22px;display:grid;place-items:center}.gesture:after{content:'';width:100px;height:4px;border-radius:4px;background:#c6d1ca}.note{padding:0 20px 20px;color:#9fb0a5;font-size:12px;text-align:right} @media(max-height:900px){iframe{height:calc(100dvh - 185px);min-height:400px}}
</style><div class="controls"><strong>手機介面預覽</strong><label>寬度 <select id="width"><option value="360">360 px</option><option value="390" selected>390 px</option><option value="412">412 px</option></select></label><button id="refresh">刷新</button></div><div class="stage"><div class="phone" id="phone"><div class="status"><span>9:41</span><span class="camera"></span><span>▰ 100%</span></div><iframe id="app" title="拾檔手機介面" src="index.html"></iframe><div class="gesture"></div></div></div><div class="note">使用 App 同一套介面 · 示範資料<br>尺寸模擬，非 Android 模擬器；系統字體縮放與權限視窗以實機為準。</div><script>const phone=document.getElementById('phone'),frame=document.getElementById('app');function resize(){phone.style.width=(Number(document.getElementById('width').value)+14)+'px'}document.getElementById('width').onchange=resize;document.getElementById('refresh').onclick=()=>frame.contentWindow.location.reload();resize();</script></html>
