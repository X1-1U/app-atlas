<div class="shell"><aside><div class="brand"><span class="mark">拾</span>拾檔<small>OFFLINE STORAGE CARE</small></div><nav aria-label="主要導覽"><button class="navbtn active" data-page="clean">◈　清理</button><button class="navbtn" data-page="browse">▦　找檔案</button><button class="navbtn" data-page="apps">▤　應用</button><button class="navbtn" data-page="settings">⚙　設定</button></nav><div class="aside-note">檔案留在你的手機<br>不申請網路權限 · v0.9</div></aside>
<main><div class="topline"><span class="eyebrow">拾檔<span class="brand-dot">.</span></span><span class="badge" id="mode">離線 · 介面示範</span></div><div class="page-title"><button class="browse-back" id="back-sources" aria-label="返回 App 分類" title="返回 App 分類" hidden>‹</button><h1 id="heading">檔案，跟著 App 找。</h1></div><p id="subtitle">不用記住路徑，從熟悉的 App 開始。</p><div id="notice" role="status">示範資料，不是你的手機檔案。</div>
<section id="authorization"></section><section id="installedpage" hidden></section><section id="cleanup"></section><section id="browser" hidden><div id="browse-sources"><div class="section-head"><h2>按 App 探索</h2><button class="textbtn" id="add">掃描授權</button></div><div class="source-toolbar"><div class="search"><input id="source-search" type="search" placeholder="搜尋 App 或分類" aria-label="搜尋 App 分類"></div><div class="view-options" role="group" aria-label="分類顯示方式"><button class="btn" id="view-grid">▦ 格子</button><button class="btn" id="view-list">☰ 列表</button></div></div><p class="subtle">選擇 App 查看檔案；選「全部」可跨 App 搜尋。</p><div class="apps" id="apps"></div></div><div id="browse-files" hidden><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="例如：TG 最近7天 影片、大於100MB" aria-label="搜尋檔案"></div><div id="search-help" class="subtle" role="status"></div><div id="search-suggestions" class="suggestions"></div><details id="source-notes"><summary>來源辨識說明與未歸類下載</summary><div id="source-help" class="access-card" hidden></div></details><div class="summary"><div><p id="summary-label">已整理的檔案</p><strong id="total">—</strong><span id="total-count"></span></div><button id="refresh">重新掃描 ↻</button></div><div class="filters" id="filters" aria-label="檔案類型"></div><div class="countrow"><span id="result-count"></span><select id="sort" aria-label="檔案排序"><option value="relevance">相關程度</option><option value="date">最近更新</option><option value="size">檔案由大到小</option><option value="name">檔案名稱</option></select></div><div class="files" id="files"></div></div></section>
<section id="settings" hidden></section><div class="foot">只整理可存取的檔案 · 不搬動原始位置</div></main></div>
<dialog id="detail" tabindex="-1"><div class="dialog-handle" aria-hidden="true"></div><h2 id="detail-title"></h2><div id="detail-body"></div><div class="actions"><button class="btn primary" id="open-file">開啟檔案</button><button class="btn danger" id="delete-file">刪除…</button><button class="btn" onclick="document.getElementById('detail').close()">關閉</button></div></dialog>
<dialog id="folder-dialog"><h2>把資料夾歸到 App</h2><p>輸入分類名稱，再選擇手機上的資料夾。你可以替同一個 App 加入多個資料夾。</p><label for="app-name">App 或分類名稱</label><input id="app-name" maxlength="40" placeholder="例如 Telegram" list="app-names"><datalist id="app-names"><option value="Telegram"><option value="Bilibili"><option value="WhatsApp"></datalist><p>Android/data 等受限制的目錄可能無法選取。第一版只接受手機本機儲存空間。</p><div class="actions"><button class="btn primary" id="choose-folder">選擇資料夾</button><button class="btn" onclick="document.getElementById('folder-dialog').close()">取消</button></div></dialog><div id="toast" role="status" hidden></div>
<script src="cleanup.js"></script><script src="file-intelligence.js"></script><script src="app.js"></script></body></html>
